{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="adun-card mt-4">

            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='images/adun_logo.png') }}"
                     width="65" class="mb-3">
                <h3 class="fw-bold" style="color: #0B2458;">Create Account</h3>
                <p class="text-muted" style="font-size: 14px;">
                    Register to access ADUN Photo Archive
                </p>
            </div>

            <form method="POST" action="/register">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name"
                               class="form-control form-control-lg"
                               placeholder="e.g. Esther Ene Idoko" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email"
                               class="form-control form-control-lg"
                               placeholder="yourname@aun.edu.ng" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input type="password" name="password"
                               class="form-control form-control-lg"
                               placeholder="Create a password" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password"
                               class="form-control form-control-lg"
                               placeholder="Repeat password" required>
                    </div>
                    <div class="col-12 mt-2">
                        <button type="submit"
                                class="btn btn-navy btn-lg w-100 fw-bold">
                            Create Account
                        </button>
                    </div>
                </div>
            </form>

            <p class="text-center mt-4" style="font-size: 14px; color: #6B7A99;">
                Already have an account?
                <a href="/login"
                   style="color: #0B2458; font-weight: 700;">
                    Login here
                </a>
            </p>

        </div>
    </div>
</div>
{% endblock %}
