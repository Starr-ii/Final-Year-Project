{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="page-title">Create New Event</h2>
                <p class="page-subtitle">Add a new school event to the archive</p>
            </div>
            <a href="/events" class="btn btn-navy">View All Events</a>
        </div>

        <div class="card border-0 shadow-sm p-4"
             style="border-radius: 14px;">
            <form method="POST" action="/create_event">
                <div class="mb-3">
                    <label class="form-label">Event Name</label>
                    <input type="text" name="event_name"
                           class="form-control form-control-lg"
                           placeholder="e.g. Matriculation 2025" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Event Date</label>
                    <input type="date" name="event_date"
                           class="form-control form-control-lg" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">
                        Description
                        <span class="text-muted fw-normal">(optional)</span>
                    </label>
                    <textarea name="description" class="form-control"
                              rows="3"
                              placeholder="Brief description of the event...">
                    </textarea>
                </div>
                <button type="submit" class="btn btn-navy btn-lg w-100 fw-bold">
                    Create Event
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
