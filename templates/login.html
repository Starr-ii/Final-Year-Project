{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="adun-card mt-4">

            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='images/adun_logo.png') }}"
                     width="65" class="mb-3">
                <h3 class="fw-bold" style="color: #0B2458;">Welcome Back</h3>
                <p class="text-muted" style="font-size: 14px;">
                    Sign in to your ADUN Photo Archive account
                </p>
            </div>

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email"
                           class="form-control form-control-lg"
                           placeholder="yourname@aun.edu.ng" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password"
                           class="form-control form-control-lg"
                           placeholder="Enter your password" required>
                </div>
                <button type="submit"
                        class="btn btn-navy btn-lg w-100 fw-bold">
                    Login
                </button>
            </form>

            <p class="text-center mt-4" style="font-size: 14px; color: #6B7A99;">
                Don't have an account?
                <a href="/register"
                   style="color: #0B2458; font-weight: 700;">
                    Register here
                </a>
            </p>

        </div>
    </div>
</div>
{% endblock %}
