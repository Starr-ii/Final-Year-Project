{% extends "base.html" %}

{% block content %}

<style>
    #main-wrapper {
        padding: 0 !important;
        margin: 0 !important;
    }

    .hero {
        min-height: calc(100vh - 65px);
        background-image: url("{{ url_for('static', filename='images/bg.JPG') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .hero::before {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(7, 24, 64, 0.65);
    }

    .hero-content {
        position: relative;
        z-index: 1;
        padding: 0 24px;
        max-width: 700px;
    }

    .hero-tagline {
        font-size: 42px;
        font-weight: 900;
        color: white;
        line-height: 1.2;
        margin-bottom: 12px;
    }

    .hero-tagline span {
        color: #E8A020;
    }

    .hero-sub {
        color: rgba(255, 255, 255, 0.75);
        font-size: 16px;
        margin-bottom: 36px;
    }

    .hero-buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn-hero-primary {
        background: #E8A020;
        color: white;
        border: none;
        padding: 14px 36px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s;
    }

    .btn-hero-primary:hover {
        background: #c98a18;
        color: white;
        transform: translateY(-2px);
    }

    .btn-hero-secondary {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.6);
        padding: 14px 36px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s;
        backdrop-filter: blur(4px);
    }

    .btn-hero-secondary:hover {
        background: rgba(255, 255, 255, 0.25);
        color: white;
        transform: translateY(-2px);
    }
</style>

<div class="hero">
    <div class="hero-content">

        <img src="{{ url_for('static', filename='images/adun_logo.png') }}"
             width="85"
             style="margin-bottom: 24px;
                    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));">

        <h1 class="hero-tagline">
            Your School Memories,<br>
            <span>Always Within Reach</span>
        </h1>

        <p class="hero-sub">
            Admiralty University of Nigeria — Smart Event Photo Archive
        </p>

        <div class="hero-buttons">
            <a href="/login" class="btn-hero-primary">
                Login
            </a>
            <a href="/register" class="btn-hero-secondary">
                Create Account
            </a>
        </div>

    </div>
</div>

{% endblock %}
